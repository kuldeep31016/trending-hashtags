# Single-node Kafka (KRaft, no ZooKeeper) + single-node Hadoop (HDFS + YARN).
# Verified on an Apple Silicon Mac (Docker Desktop): Kafka runs natively (arm64), the Hadoop
# images are amd64-only and run under emulation, so MapReduce jobs take 45-120 s.
# HDFS lives inside the containers (not on volumes): `docker compose down` or recreating the
# Hadoop containers starts with an empty HDFS. The dashboard's history is kept on the host
# (data/pulsetrend.db), so it survives.
x-restart: &restart
  restart: on-failure:3

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    <<: *restart
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 10s
      timeout: 5s
      retries: 12

  namenode:
    image: apache/hadoop:3.3.6
    container_name: namenode
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports: ["9870:9870"]
    env_file: [./hadoop.config]
    environment:
      # Format only when the real name dir is missing (i.e. a brand-new container). The image
      # runs as user "hadoop", so the dir is /tmp/hadoop-hadoop/...; pointing this at a path
      # that never exists reformatted HDFS on every restart and locked the DataNode out.
      ENSURE_NAMENODE_DIR: "/tmp/hadoop-hadoop/dfs/name"
    volumes:
      - ./mapreduce:/project/mapreduce:ro
    <<: *restart
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9870/jmx?qry=Hadoop:service=NameNode,name=NameNodeStatus | grep -q active"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  datanode:
    image: apache/hadoop:3.3.6
    container_name: datanode
    command: ["hdfs", "datanode"]
    env_file: [./hadoop.config]
    depends_on:
      namenode: {condition: service_healthy}
    <<: *restart

  resourcemanager:
    image: apache/hadoop:3.3.6
    container_name: resourcemanager
    hostname: resourcemanager
    command: ["yarn", "resourcemanager"]
    ports: ["8088:8088"]
    env_file: [./hadoop.config]
    <<: *restart
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://resourcemanager:8088/ws/v1/cluster/info | grep -q STARTED"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  nodemanager:
    # apache/hadoop + Python 3.8, so Hadoop Streaming can run the Python mapper/reducer
    build:
      context: ./docker
      dockerfile: nodemanager.Dockerfile
    image: trending-hashtags/nodemanager:3.3.6
    platform: linux/amd64
    container_name: nodemanager
    command: ["yarn", "nodemanager"]
    env_file: [./hadoop.config]
    depends_on:
      resourcemanager: {condition: service_healthy}
    <<: *restart
