<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Near-real-time trending hashtags: Kafka, HDFS and Hadoop MapReduce over a sliding 5-minute window." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PulseTrend · Trending Hashtags</title>
    <script>
      // apply the saved theme before first paint (no light/dark flash)
      try {
        var t = localStorage.getItem("pt-theme");
        if (t !== "light" && t !== "dark") t = "light";
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = "light"; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
